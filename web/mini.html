<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Submini">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon-180.png">
<link rel="apple-touch-icon" sizes="152x152" href="/icons/apple-touch-icon-152.png">
<link rel="apple-touch-icon" sizes="120x120" href="/icons/apple-touch-icon-120.png">
<link rel="apple-touch-icon" sizes="76x76" href="/icons/apple-touch-icon-76.png">
<link rel="apple-touch-icon-precomposed" sizes="180x180" href="/icons/apple-touch-icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/favicon-192.png">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<link rel="apple-touch-startup-image" href="/icons/splash-ipad-portrait.png" media="(device-width: 768px) and (device-height: 1024px) and (orientation: portrait)">
<link rel="apple-touch-startup-image" href="/icons/splash-ipad-landscape.png" media="(device-width: 768px) and (device-height: 1024px) and (orientation: landscape)">
<link rel="apple-touch-startup-image" href="/icons/splash-ipad-portrait@2x.png" media="(device-width: 768px) and (device-height: 1024px) and (orientation: portrait) and (-webkit-device-pixel-ratio: 2)">
<link rel="apple-touch-startup-image" href="/icons/splash-ipad-landscape@2x.png" media="(device-width: 768px) and (device-height: 1024px) and (orientation: landscape) and (-webkit-device-pixel-ratio: 2)">
<title>Submini 音乐</title>
<style>
  /* Palette lifted from subgram's web UI (dark, mint accent #7dd3c0),
     simplified for iOS 9: no flex/grid/gap, floats only. */
  * { -webkit-tap-highlight-color: rgba(255,255,255,0.08); }
  html, body { margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
         background: #0b0d12; color: #eef0f4; font-size: 16px; padding-bottom: 306px;
         -webkit-text-size-adjust: 100%; }
  button { font-family: inherit; cursor: pointer; }
  /* ---------- login ---------- */
  #loginView { max-width: 420px; margin: 60px auto 0 auto; padding: 0 24px; }
  #loginView h1 { font-size: 26px; text-align: center; margin: 0 0 6px 0; }
  #loginView .sub { text-align: center; color: rgba(238,240,244,0.6); font-size: 14px; margin-bottom: 28px; }
  #loginView label { display: block; font-size: 14px; color: rgba(238,240,244,0.6); margin: 14px 0 6px 0; }
  #loginView input { width: 100%; box-sizing: border-box; font-size: 17px; padding: 12px;
                     border: 1px solid rgba(255,255,255,0.14); border-radius: 8px;
                     background: #171a21; color: #eef0f4; }
  #loginBtn { width: 100%; margin-top: 22px; font-size: 18px; padding: 13px 0;
              background: #7dd3c0; color: #0b0d12; font-weight: bold; border: none; border-radius: 8px; }
  #loginMsg { color: #ff6b6b; font-size: 14px; text-align: center; min-height: 20px; margin-top: 12px; }
  /* ---------- app frame ---------- */
  #tabs { position: fixed; top: 0; left: 0; right: 0; background: #171a21; z-index: 10;
          overflow: hidden; border-bottom: 1px solid rgba(255,255,255,0.1); }
  #tabs button { float: left; background: none; border: none; color: rgba(238,240,244,0.6);
                 font-size: 16px; padding: 13px 10px; }
  #tabs button.on { color: #eef0f4; font-weight: bold; border-bottom: 3px solid #7dd3c0; }
  #tabs #logoutBtn { float: right; color: rgba(238,240,244,0.4); font-size: 14px; }
  #main { margin-top: 51px; }
  #searchBar { padding: 10px 12px; background: #171a21; overflow: hidden; display: none; }
  #searchInput { float: left; width: 76%; box-sizing: border-box; font-size: 16px;
                 padding: 10px; border: 1px solid rgba(255,255,255,0.14); border-radius: 8px;
                 background: #21252f; color: #eef0f4; }
  #searchBtn { float: right; width: 21%; font-size: 16px; padding: 10px 0;
               background: #7dd3c0; color: #0b0d12; font-weight: bold; border: none; border-radius: 8px; }
  #crumb { overflow: hidden; padding: 8px 12px; background: #171a21;
           border-bottom: 1px solid rgba(255,255,255,0.1); display: none; }
  #backBtn { float: left; background: none; border: none; color: #7dd3c0; font-size: 16px; padding: 4px 8px 4px 0; }
  #crumbTitle { font-size: 16px; font-weight: bold; line-height: 28px; white-space: nowrap;
                overflow: hidden; text-overflow: ellipsis; }
  #status { padding: 10px 14px; color: rgba(238,240,244,0.6); font-size: 14px; display: none; }
  #status.err { color: #ff6b6b; }
  /* ---------- lists ---------- */
  ul#list { list-style: none; margin: 0; padding: 0; }
  ul#list li { border-bottom: 1px solid rgba(255,255,255,0.07); padding: 12px 14px; overflow: hidden;
               min-height: 44px; box-sizing: border-box; }
  ul#list li .t { font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  ul#list li .s { font-size: 13px; color: rgba(238,240,244,0.55); margin-top: 3px; white-space: nowrap;
                  overflow: hidden; text-overflow: ellipsis; }
  ul#list li img { float: left; width: 48px; height: 48px; margin-right: 12px; border-radius: 4px;
                   background: #21252f; }
  ul#list li.playing .t { color: #7dd3c0; font-weight: bold; }
  ul#list li.section { background: #171a21; color: rgba(238,240,244,0.6); font-size: 13px; min-height: 0;
                       padding: 7px 14px; font-weight: bold; }
  ul#list li .go { float: right; color: rgba(255,255,255,0.25); font-size: 20px; line-height: 44px; }
  /* ---------- player bar ---------- */
  #player { position: fixed; left: 0; right: 0; bottom: 0; background: #171a21; color: #eef0f4;
            z-index: 10; padding: 8px 10px 10px 10px; border-top: 1px solid rgba(255,255,255,0.12); }
  /* walkman on the left, song info on the right (user layout) */
  #npRow { overflow: hidden; }
  #walkman { float: left; width: 228px; }
  #walkman svg { display: block; width: 100%; height: auto; }
  .wkey { cursor: pointer; }
  #npInfo { margin-left: 246px; padding-top: 36px; }
  #npTitle { font-size: 18px; font-weight: bold; white-space: nowrap; overflow: hidden;
             text-overflow: ellipsis; }
  #npArtist { font-size: 14px; color: rgba(238,240,244,0.75); white-space: nowrap; overflow: hidden;
              text-overflow: ellipsis; margin-top: 5px; }
  #npAlbum { font-size: 12px; color: rgba(238,240,244,0.45); white-space: nowrap; overflow: hidden;
             text-overflow: ellipsis; margin-top: 3px; }
  #ctlRow { overflow: hidden; margin-top: 6px; }
  #ctlRow .btns { float: left; }
  #ctlRow .btns button { width: 46px; height: 46px; border: none; border-radius: 50%;
                         background: rgba(255,255,255,0.07); color: #eef0f4; font-size: 19px;
                         padding: 0; margin-right: 10px; vertical-align: middle; position: relative; }
  #ctlRow .btns button:active { background: rgba(255,255,255,0.16); }
  #ctlRow #playBtn { width: 58px; height: 58px; background: #7dd3c0; color: #0b0d12; font-size: 23px; }
  #ctlRow #playBtn:active { background: #a7e8d8; }
  /* vector icons in the transport buttons: iOS renders the old text glyphs
     as colour emoji, which clashed with the design; SVG looks identical
     on every device and takes the button's colour via fill/stroke */
  #ctlRow .btns button { line-height: 46px; }
  #ctlRow .btns button svg { display: inline-block; vertical-align: middle; }
  #ctlRow .btns button .icF { width: 22px; height: 22px; fill: #eef0f4; }
  #ctlRow .btns button .icS { width: 20px; height: 20px; fill: none; stroke: #eef0f4; stroke-width: 2;
                              stroke-linecap: round; stroke-linejoin: round; }
  #ctlRow #playBtn { line-height: 58px; }
  #ctlRow #playBtn .icF { width: 26px; height: 26px; fill: #0b0d12; }
  #ctlRow #shuffleBtn.on .icS { stroke: #7dd3c0; }
  #ctlRow #shuffleBtn.on { background: rgba(125,211,192,0.30); }
  #ctlRow #shuffleBtn.on:after { content: ''; position: absolute; left: 50%; bottom: -8px;
                                 width: 5px; height: 5px; margin-left: -3px; border-radius: 50%;
                                 background: #7dd3c0; }
  /* repeat-one lives only in the fullscreen player */
  #repeatBtn { display: none; }
  #player.full #repeatBtn { display: inline-block; }
  #ctlRow #repeatBtn.on { background: rgba(125,211,192,0.30); }
  #ctlRow #repeatBtn.on .icS { stroke: #7dd3c0; }
  #ctlRow #repeatBtn.on:after { content: ''; position: absolute; left: 50%; bottom: -8px;
                                width: 5px; height: 5px; margin-left: -3px; border-radius: 50%;
                                background: #7dd3c0; }
  #repeatBtn .repOne { font-size: 8.5px; font-weight: bold; fill: #eef0f4; stroke: none; }
  #ctlRow #repeatBtn.on .repOne { fill: #7dd3c0; }
  #timeBox { float: right; color: rgba(238,240,244,0.6); font-size: 13px; line-height: 58px; }
  /* slim visible track, fat invisible tap target (padding) for seeking */
  #progWrap { padding: 7px 0; margin-top: 1px; }
  #progTrack { background: rgba(255,255,255,0.15); height: 5px; border-radius: 3px; }
  #progFill { background: #7dd3c0; height: 5px; border-radius: 3px; width: 0%; }
  /* ---------- fullscreen player (default view; bar is the shrunk form) ---------- */
  #player .miniBtn { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.22);
                     color: #eef0f4; font-size: 14px; border-radius: 8px; padding: 5px 12px; }
  #expandBtn { float: right; margin: 8px 0 0 10px; }
  #collapseBtn { display: none; position: absolute; top: 12px; right: 12px; z-index: 2; }
  #player.full { top: 0; z-index: 20; overflow-y: auto; padding: 20px 16px 16px 16px; }
  #player.full #collapseBtn { display: block; }
  #player.full #expandBtn { display: none; }
  #player.full #walkman { float: none; width: 340px; margin: 16px auto 0 auto; }
  @media (orientation: landscape) { #player.full #walkman { width: 248px; } }
  #player.full #npInfo { margin-left: 0; padding-top: 14px; text-align: center; }
  #player.full #npTitle { font-size: 24px; }
  #player.full #npArtist { font-size: 17px; }
  #player.full #npAlbum { font-size: 14px; }
  #player.full #progWrap { margin-top: 12px; padding: 9px 0; }
  #player.full #ctlRow .btns { float: none; text-align: center; }
  #player.full #ctlRow .btns button { width: 56px; height: 56px; font-size: 23px; margin-right: 14px; line-height: 56px; }
  #player.full #ctlRow #playBtn { width: 74px; height: 74px; font-size: 30px; line-height: 74px; }
  #player.full #ctlRow .btns button .icF { width: 26px; height: 26px; }
  #player.full #ctlRow #playBtn .icF { width: 32px; height: 32px; }
  #player.full #ctlRow .btns button .icS { width: 24px; height: 24px; }
  #player.full #timeBox { float: none; text-align: center; line-height: 26px; }
  #queueBox { display: none; margin-top: 16px; }
  #player.full #queueBox { display: block; }
  #queueBox .qhead { font-size: 14px; color: rgba(238,240,244,0.55); margin-bottom: 6px;
                     overflow: hidden; line-height: 30px; }
  #refreshQueueBtn { float: right; }
  #queueEmpty { color: rgba(238,240,244,0.5); font-size: 14px; padding: 10px 2px; }
  ul#queueList { list-style: none; margin: 0; padding: 0; }
  ul#queueList li { overflow: hidden; padding: 9px 10px; border-bottom: 1px solid rgba(255,255,255,0.07);
                    font-size: 16px; }
  ul#queueList li .sub { display: block; font-size: 12px; color: rgba(238,240,244,0.5); margin-top: 2px; }
  ul#queueList li.playing { color: #7dd3c0; }
  /* wide landscape (iPad): deck on the left at full size, info, progress
     and controls in a right-hand column, queue below spanning the width */
  @media (orientation: landscape) and (min-width: 900px) {
    #player.full #npRow { overflow: visible; }
    #player.full #walkman { float: left; width: 404px; margin: 26px 0 0 26px; }
    #player.full #npInfo { margin-left: 458px; text-align: left; padding-top: 64px; }
    #player.full #npTitle { font-size: 27px; }
    #player.full #progWrap { margin-left: 458px; margin-right: 26px; }
    #player.full #ctlRow { margin-left: 458px; margin-right: 26px; }
    #player.full #ctlRow .btns { text-align: left; }
    #player.full #timeBox { text-align: left; }
    #player.full #queueBox { clear: both; }
  }
</style>
</head>
<body>

<div id="loginView">
  <h1>Submini</h1>
  <div class="sub">为老 iPad 准备的极简音乐播放器<br>连接信息保存在后端，设置一次即可</div>
  <label for="server">服务器地址</label>
  <input id="server" type="url" autocapitalize="off" autocorrect="off" placeholder="http://192.168.1.10:4533">
  <label for="user">用户名</label>
  <input id="user" type="text" autocapitalize="off" autocorrect="off" autocomplete="username">
  <label for="pass">密码</label>
  <input id="pass" type="password" autocomplete="current-password">
  <button id="loginBtn">连接并保存</button>
  <div id="loginMsg"></div>
</div>

<div id="appView" style="display:none">
  <div id="tabs">
    <button id="tabPlaylists">歌单</button>
    <button id="tabAlbums">专辑</button>
    <button id="tabArtists">歌手</button>
    <button id="tabRandom">随机</button>
    <button id="tabSearch">搜索</button>
    <button id="logoutBtn">退出</button>
  </div>
  <div id="main">
    <div id="searchBar">
      <input id="searchInput" type="search" placeholder="搜索歌曲 / 专辑 / 歌手">
      <button id="searchBtn">搜索</button>
    </div>
    <div id="crumb"><button id="backBtn">‹ 返回</button><div id="crumbTitle"></div></div>
    <div id="status"></div>
    <ul id="list"></ul>
  </div>
  <div id="player">
    <button id="collapseBtn" class="miniBtn">收起</button>
    <div id="npRow">
      <div id="walkman">
        <svg viewBox="0 0 360 312" width="228" height="198">
          <defs>
            <linearGradient id="wmMetal" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#f4f5f7"></stop><stop offset="0.18" stop-color="#d5d8de"></stop>
              <stop offset="0.55" stop-color="#afb4bd"></stop><stop offset="0.85" stop-color="#979ca5"></stop>
              <stop offset="1" stop-color="#868b95"></stop>
            </linearGradient>
            <linearGradient id="wmSide" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#5d626b"></stop><stop offset="1" stop-color="#34373d"></stop>
            </linearGradient>
            <linearGradient id="wmBevel" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"></stop>
              <stop offset="0.45" stop-color="#ffffff" stop-opacity="0.15"></stop>
              <stop offset="1" stop-color="#000000" stop-opacity="0.35"></stop>
            </linearGradient>
            <linearGradient id="wmGroove" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#000000" stop-opacity="0.45"></stop>
              <stop offset="0.6" stop-color="#000000" stop-opacity="0.1"></stop>
              <stop offset="1" stop-color="#ffffff" stop-opacity="0.85"></stop>
            </linearGradient>
            <linearGradient id="wmSheen" x1="0" y1="0" x2="1" y2="0.55">
              <stop offset="0.2" stop-color="#ffffff" stop-opacity="0"></stop>
              <stop offset="0.34" stop-color="#ffffff" stop-opacity="0.5"></stop>
              <stop offset="0.42" stop-color="#ffffff" stop-opacity="0"></stop>
              <stop offset="0.66" stop-color="#ffffff" stop-opacity="0"></stop>
              <stop offset="0.72" stop-color="#ffffff" stop-opacity="0.18"></stop>
              <stop offset="0.78" stop-color="#ffffff" stop-opacity="0"></stop>
            </linearGradient>
            <pattern id="wmBrush" width="6" height="2" patternUnits="userSpaceOnUse">
              <rect width="6" height="0.8" fill="#ffffff" fill-opacity="0.12"></rect>
            </pattern>
            <linearGradient id="wmKey" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#ffffff"></stop><stop offset="0.45" stop-color="#e2e4e8"></stop>
              <stop offset="1" stop-color="#b3b7bf"></stop>
            </linearGradient>
            <linearGradient id="wmRecess" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#000000" stop-opacity="0.7"></stop>
              <stop offset="0.12" stop-color="#000000" stop-opacity="0"></stop>
            </linearGradient>
            <linearGradient id="wmGlass" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#ffffff" stop-opacity="0.2"></stop>
              <stop offset="0.3" stop-color="#ffffff" stop-opacity="0.04"></stop>
              <stop offset="0.31" stop-color="#ffffff" stop-opacity="0"></stop>
              <stop offset="1" stop-color="#9fb4d8" stop-opacity="0.08"></stop>
            </linearGradient>
            <linearGradient id="wmShell" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#3a3d45"></stop><stop offset="1" stop-color="#1b1d22"></stop>
            </linearGradient>
            <linearGradient id="wmPaper" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#faf5e9"></stop><stop offset="1" stop-color="#e9dfc8"></stop>
            </linearGradient>
            <radialGradient id="wmPack">
              <stop offset="0" stop-color="#22170f"></stop><stop offset="0.7" stop-color="#4a3426"></stop>
              <stop offset="0.93" stop-color="#6d4f3b"></stop><stop offset="1" stop-color="#3a281d"></stop>
            </radialGradient>
            <radialGradient id="wmHub" cx="0.4" cy="0.35">
              <stop offset="0" stop-color="#ffffff"></stop><stop offset="1" stop-color="#cfc9bc"></stop>
            </radialGradient>
            <radialGradient id="wmScrew" cx="0.35" cy="0.3">
              <stop offset="0" stop-color="#9aa0aa"></stop><stop offset="1" stop-color="#3c4048"></stop>
            </radialGradient>
            <linearGradient id="wmWheel" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0" stop-color="#3b3f46"></stop><stop offset="0.5" stop-color="#9196a0"></stop>
              <stop offset="1" stop-color="#3b3f46"></stop>
            </linearGradient>
            <radialGradient id="wmLedOn" cx="0.4" cy="0.35">
              <stop offset="0" stop-color="#e6fff0"></stop><stop offset="0.45" stop-color="#4dff88"></stop>
              <stop offset="1" stop-color="#119140"></stop>
            </radialGradient>
            <radialGradient id="wmLedOff" cx="0.4" cy="0.35">
              <stop offset="0" stop-color="#5d6b61"></stop><stop offset="1" stop-color="#1d2520"></stop>
            </radialGradient>
            <clipPath id="wmBodyClip"><rect x="4" y="26" width="352" height="270" rx="20"></rect></clipPath>
            <clipPath id="wmLidClip"><rect x="22" y="46" width="316" height="206" rx="12"></rect></clipPath>
            <clipPath id="wmWinClip"><rect x="74" y="66" width="172" height="52" rx="26"></rect></clipPath>
          </defs>
          <g class="wkey" id="keyPrev">
            <rect x="34" y="10" width="52" height="30" rx="5" fill="#6b7079"></rect>
            <rect x="34" y="6" width="52" height="30" rx="5" fill="url(#wmKey)"></rect>
            <path d="M39 7 H81" stroke="#ffffff" stroke-opacity="0.9"></path>
            <text x="60" y="25" font-size="12" text-anchor="middle" fill="#3a3d44">&#9664;&#9664;</text>
          </g>
          <g class="wkey" id="keyPlay">
            <g id="keyPlayFace">
              <rect x="92" y="10" width="52" height="30" rx="5" fill="#6b7079"></rect>
              <rect x="92" y="6" width="52" height="30" rx="5" fill="url(#wmKey)"></rect>
              <path d="M97 7 H139" stroke="#ffffff" stroke-opacity="0.9"></path>
              <text x="118" y="25" font-size="12" text-anchor="middle" fill="#3a3d44">&#9654;</text>
            </g>
          </g>
          <g class="wkey" id="keyNext">
            <rect x="150" y="10" width="52" height="30" rx="5" fill="#6b7079"></rect>
            <rect x="150" y="6" width="52" height="30" rx="5" fill="url(#wmKey)"></rect>
            <path d="M155 7 H197" stroke="#ffffff" stroke-opacity="0.9"></path>
            <text x="176" y="25" font-size="12" text-anchor="middle" fill="#3a3d44">&#9654;&#9654;</text>
          </g>
          <g class="wkey" id="keyStop">
            <rect x="208" y="10" width="52" height="30" rx="5" fill="#6b7079"></rect>
            <rect x="208" y="6" width="52" height="30" rx="5" fill="url(#wmKey)"></rect>
            <path d="M213 7 H255" stroke="#ffffff" stroke-opacity="0.9"></path>
            <text x="234" y="25" font-size="12" text-anchor="middle" fill="#3a3d44">&#9632;</text>
          </g>
          <rect x="4" y="34" width="352" height="270" rx="20" fill="url(#wmSide)"></rect>
          <rect x="4" y="26" width="352" height="270" rx="20" fill="url(#wmMetal)"></rect>
          <g clip-path="url(#wmBodyClip)">
            <rect x="4" y="26" width="352" height="270" fill="url(#wmBrush)"></rect>
            <rect x="-60" y="26" width="480" height="270" fill="url(#wmSheen)"></rect>
          </g>
          <rect x="5" y="27" width="350" height="268" rx="19" fill="none" stroke="url(#wmBevel)" stroke-width="2"></rect>
          <circle cx="318" cy="36" r="5.5" fill="#c9ccd2" stroke="#7d828b" stroke-width="0.8"></circle>
          <circle cx="318" cy="36" r="3.2" fill="#14161a"></circle>
          <rect x="352" y="96" width="8" height="64" rx="3" fill="url(#wmWheel)"></rect>
          <path d="M352 102h8M352 108h8M352 114h8M352 120h8M352 126h8M352 132h8M352 138h8M352 144h8M352 150h8M352 156h8" stroke="#2c2f35" stroke-opacity="0.7"></path>
          <rect x="17" y="41" width="326" height="216" rx="16" fill="none" stroke="url(#wmGroove)" stroke-width="3"></rect>

<script>
/* ================= Subsonic API layer ================= */
var CLIENT = 'submini', APIV = '1.16.1';
function $(id) { return document.getElementById(id); }
function asArray(x) {
  if (!x) return [];
  if (Object.prototype.toString.call(x) === '[object Array]') return x;
  return [x];
}
function restUrl(endpoint, params, json) {
  var q = [];
  var k;
  for (k in params) {
    if (params.hasOwnProperty(k)) q.push(encodeURIComponent(k) + '=' + encodeURIComponent(params[k]));
  }
  q.push('v=' + APIV);
  q.push('c=' + CLIENT);
  if (json) q.push('f=json');
  return '/rest/' + endpoint + '.view?' + q.join('&');
}
function api(endpoint, params, ok, fail) {
  setStatus('加载中…', false);
  var xhr = new XMLHttpRequest();
  xhr.open('GET', restUrl(endpoint, params, true), true);
  xhr.onreadystatechange = function () {
    if (xhr.readyState !== 4) return;
    if (xhr.status !== 200) { setStatus('请求失败（HTTP ' + xhr.status + '）', true); if (fail) fail(); return; }
    var data;
    try { data = JSON.parse(xhr.responseText); } catch (e) { setStatus('服务器响应无法解析', true); if (fail) fail(); return; }
    var root = data['subsonic-response'];
    if (!root || root.status !== 'ok') {
      var msg = (root && root.error && root.error.message) ? root.error.message : '未知错误';
      setStatus('服务器错误：' + msg, true);
      if (fail) fail(root);
      return;
    }
    setStatus('', false);
    ok(root);
  };
  xhr.send(null);
}
function streamUrl(id) { return restUrl('stream', { id: id, format: 'mp3' }, false); }
function coverUrl(id) { return restUrl('getCoverArt', { id: id, size: 96 }, false); }

/* ================= UI helpers ================= */
function fmtTime(sec) {
  if (!sec || !isFinite(sec)) return '0:00';
  sec = Math.floor(sec);
  var m = Math.floor(sec / 60), s = sec % 60;
  return m + ':' + (s < 10 ? '0' : '') + s;
}
function setStatus(msg, isErr) {
  var el = $('status');
  el.innerHTML = '';
  if (!msg) { el.style.display = 'none'; return; }
  el.style.display = 'block';
  el.className = isErr ? 'err' : '';
  el.appendChild(document.createTextNode(msg));
}
var navStack = [];
function clearList() { var l = $('list'); while (l.firstChild) l.removeChild(l.firstChild); }
function showCrumb(title) {
  if (navStack.length > 0) {
    $('crumb').style.display = 'block';
    $('crumbTitle').innerHTML = '';
    $('crumbTitle').appendChild(document.createTextNode(title || ''));
  } else {
    $('crumb').style.display = 'none';
  }
}
function openView(title, builder) {
  navStack.push({ title: title, builder: builder });
  showCrumb(title);
  builder();
}
function goRoot(builder) {
  navStack = [];
  showCrumb('');
  builder();
}
function addRow(build) {
  var li = document.createElement('li');
  build(li);
  $('list').appendChild(li);
  return li;
}
function sectionRow(text) {
  addRow(function (li) {
    li.className = 'section';
    li.appendChild(document.createTextNode(text));
  });
}
function navRow(title, sub, coverId, onTap) {
  addRow(function (li) {
    if (coverId) {
      var img = document.createElement('img');
      img.src = coverUrl(coverId);
      img.alt = '';
      li.appendChild(img);
    } else {
      var go = document.createElement('span');
      go.className = 'go';
      go.appendChild(document.createTextNode('›'));
      li.appendChild(go);
    }
    var t = document.createElement('div');
    t.className = 't';
    t.appendChild(document.createTextNode(title || ''));
    li.appendChild(t);
    if (sub) {
      var s = document.createElement('div');
      s.className = 's';
      s.appendChild(document.createTextNode(sub));
      li.appendChild(s);
    }
    li.onclick = onTap;
  });
}
function songRow(song, songs) {
  var li = addRow(function (el) {
    var t = document.createElement('div');
    t.className = 't';
    t.appendChild(document.createTextNode(song.title || ''));
    el.appendChild(t);
    var sub = (song.artist || '') + (song.duration ? ' · ' + fmtTime(song.duration) : '');
    var s = document.createElement('div');
    s.className = 's';
    s.appendChild(document.createTextNode(sub));
    el.appendChild(s);
    el.onclick = function () {
      var idx = 0, i;
      for (i = 0; i < songs.length; i++) if (songs[i].id === song.id) { idx = i; break; }
      playFromList(songs, idx);
    };
  });
  li.setAttribute('data-song-id', song.id);
  markPlayingRow(li, song);
  return li;
}
function songRows(songs) {
  var i;
  for (i = 0; i < songs.length; i++) songRow(songs[i], songs);
  if (songs.length === 0) sectionRow('（空）');
}

/* ================= Views ================= */
function vPlaylists() {
  api('getPlaylists', {}, function (root) {
    clearList();
    var pls = asArray(root.playlists && root.playlists.playlist);
    var i;
    if (pls.length === 0) sectionRow('没有歌单');
    for (i = 0; i < pls.length; i++) {
      (function (pl) {
        navRow(pl.name, (pl.songCount || 0) + ' 首', pl.coverArt, function () {
          openView(pl.name, function () { vPlaylistSongs(pl.id); });
        });
      })(pls[i]);
    }
  }, function () { clearList(); });
}
function vPlaylistSongs(id) {
  api('getPlaylist', { id: id }, function (root) {
    clearList();
    songRows(asArray(root.playlist && root.playlist.entry));
  }, function () { clearList(); });
}
function albumRow(al) {
  navRow(al.name || al.title, (al.artist || '') + (al.year ? ' · ' + al.year : ''), al.coverArt, function () {
    openView(al.name || al.title, function () { vAlbum(al.id); });
  });
}
function vAlbums() {
  api('getAlbumList2', { type: 'newest', size: 60 }, function (root) {
    clearList();
    var albums = asArray(root.albumList2 && root.albumList2.album);
    var i;
    if (albums.length === 0) sectionRow('没有专辑');
    for (i = 0; i < albums.length; i++) albumRow(albums[i]);
  }, function () { clearList(); });
}
function vAlbum(id) {
  api('getAlbum', { id: id }, function (root) {
    clearList();
    songRows(asArray(root.album && root.album.song));
  }, function () { clearList(); });
}
function vArtists() {
  api('getArtists', {}, function (root) {
    clearList();
    var indexes = asArray(root.artists && root.artists.index);
    var any = false, i, j;
    for (i = 0; i < indexes.length; i++) {
      var artists = asArray(indexes[i].artist);
      if (artists.length === 0) continue;
      any = true;
      sectionRow(indexes[i].name || '');
      for (j = 0; j < artists.length; j++) {
        (function (ar) {
          navRow(ar.name, (ar.albumCount || 0) + ' 张专辑', ar.coverArt, function () {
            openView(ar.name, function () { vArtist(ar.id); });
          });
        })(artists[j]);
      }
    }
    if (!any) sectionRow('没有歌手');
  }, function () { clearList(); });
}
function vArtist(id) {
  api('getArtist', { id: id }, function (root) {
    clearList();
    var albums = asArray(root.artist && root.artist.album);
    var i;
    if (albums.length === 0) sectionRow('没有专辑');
    for (i = 0; i < albums.length; i++) albumRow(albums[i]);
  }, function () { clearList(); });
}
function vRandom() {
  api('getRandomSongs', { size: 50 }, function (root) {
    clearList();
    songRows(asArray(root.randomSongs && root.randomSongs.song));
  }, function () { clearList(); });
}
function doSearch() {
  var q = $('searchInput').value;
  if (!q) return;
  $('searchInput').blur();
  api('search3', { query: q, artistCount: 10, albumCount: 20, songCount: 50 }, function (root) {
    clearList();
    var r = root.searchResult3 || {};
    var songs = asArray(r.song), albums = asArray(r.album), artists = asArray(r.artist);
    var i;
    if (songs.length === 0 && albums.length === 0 && artists.length === 0) { sectionRow('没有结果'); return; }
    if (songs.length) { sectionRow('歌曲'); for (i = 0; i < songs.length; i++) songRow(songs[i], songs); }
    if (albums.length) { sectionRow('专辑'); for (i = 0; i < albums.length; i++) albumRow(albums[i]); }
    if (artists.length) {
      sectionRow('歌手');
      for (i = 0; i < artists.length; i++) {
        (function (ar) {
          navRow(ar.name, (ar.albumCount || 0) + ' 张专辑', ar.coverArt, function () {
            openView(ar.name, function () { vArtist(ar.id); });
          });
        })(artists[i]);
      }
    }
  }, function () { clearList(); });
}

/* ================= Player ================= */
var queue = [], qIndex = -1, nowPlayingId = null;
var audio = $('audio');
function markPlayingRow(li, song) {
  if (song.id === nowPlayingId) li.className = 'playing';
}
function refreshPlayingMarks() {
  var lis = $('list').getElementsByTagName('li'), i;
  for (i = 0; i < lis.length; i++) {
    var sid = lis[i].getAttribute('data-song-id');
    if (sid) lis[i].className = (sid === nowPlayingId) ? 'playing' : '';
  }
}
function playFromList(songs, idx) {
  queue = songs.slice(0);
  playAt(idx);
}
function clipText(s, n) { return s.length > n ? s.substring(0, n - 1) + '…' : s; }
function playAt(i) {
  if (i < 0 || i >= queue.length) return;
  qIndex = i;
  var song = queue[i];
  nowPlayingId = song.id;
  audio.src = streamUrl(song.id);
  audio.play();
  $('tapeTitle').textContent = clipText(song.title || '', 30);
  $('tapeArtist').textContent = clipText(song.artist || '', 34);
  $('npTitle').innerHTML = '';
  $('npTitle').appendChild(document.createTextNode(song.title || ''));
  $('npArtist').innerHTML = '';
  $('npArtist').appendChild(document.createTextNode(song.artist || ''));
  $('npAlbum').innerHTML = '';
  $('npAlbum').appendChild(document.createTextNode(song.album || ''));
  setPlayIcon(true);
  syncReels();
  refreshPlayingMarks();
  renderQueue();
}
function setPlayIcon(playing) {
  $('icoPlay').style.display = playing ? 'none' : 'inline-block';
  $('icoPause').style.display = playing ? 'inline-block' : 'none';
}
function togglePlay() {
  if (!audio.src) {
    /* nothing loaded yet: if the queue was prefilled (random songs on
       first open), start from the top */
    if (queue.length) playAt(0);
    return;
  }
  if (audio.paused) { audio.play(); setPlayIcon(true); }
  else { audio.pause(); setPlayIcon(false); }
}
var shuffleOn = false;
var repeatOne = false;
function next(auto) {
  if (shuffleOn && queue.length > 1) {
    var n = qIndex;
    while (n === qIndex) n = Math.floor(Math.random() * queue.length);
    playAt(n);
    return;
  }
  if (qIndex + 1 < queue.length) playAt(qIndex + 1);
  else if (auto) { setPlayIcon(false); }
}
$('shuffleBtn').onclick = function () {
  shuffleOn = !shuffleOn;
  $('shuffleBtn').className = shuffleOn ? 'on' : '';
  /* Turning shuffle on also jumps straight to a random other song, so the
     tap has an immediate, audible effect — not just a mode for later. */
  if (shuffleOn && nowPlayingId && queue.length > 1) {
    var n = qIndex;
    while (n === qIndex) n = Math.floor(Math.random() * queue.length);
    playAt(n);
  }
};
function prev() {
  if (audio.currentTime > 4) { audio.currentTime = 0; return; }
  if (qIndex > 0) playAt(qIndex - 1);
}
audio.addEventListener('ended', function () {
  if (repeatOne && qIndex >= 0) { playAt(qIndex); return; }
  next(true);
});
audio.addEventListener('timeupdate', function () {
  if (audio.duration && isFinite(audio.duration)) {
    $('progFill').style.width = (audio.currentTime / audio.duration * 100) + '%';
    $('tCur').innerHTML = fmtTime(audio.currentTime);
    $('tTot').innerHTML = fmtTime(audio.duration);
    setPack(audio.currentTime / audio.duration);
  }
});
/* Cassette reels, JS-driven like subgram's deck (iOS Safari does not
   reliably repaint CSS-animated SVG). The tape pack moves from the left
   reel to the right one as the song plays; the emptier reel spins faster. */
var reelLEl = document.getElementById('reelL'), reelREl = document.getElementById('reelR');
var packLEl = document.getElementById('packL'), packREl = document.getElementById('packR');
var angleL = 0, angleR = 0, reelTimer = null, reelLast = 0;
function setPack(frac) {
  if (!packLEl) return;
  packLEl.setAttribute('r', 15 + 29 * (1 - frac));
  packREl.setAttribute('r', 15 + 29 * frac);
}
function spinStep(ts) {
  if (audio.paused || audio.ended) { reelTimer = null; return; }
  var dt = reelLast ? (ts - reelLast) / 1000 : 0.016;
  reelLast = ts;
  if (dt > 0.1) dt = 0.1;
  var frac = (audio.duration && isFinite(audio.duration)) ? audio.currentTime / audio.duration : 0;
  var rL = 15 + 29 * (1 - frac), rR = 15 + 29 * frac;
  angleL = (angleL + 4400 / rL * dt) % 360;
  angleR = (angleR + 4400 / rR * dt) % 360;
  reelLEl.setAttribute('transform', 'rotate(' + angleL + ')');
  reelREl.setAttribute('transform', 'rotate(' + angleR + ')');
  reelTimer = requestAnimationFrame(spinStep);
}
function syncReels() {
  if (!audio.paused && !audio.ended && !reelTimer) {
    reelLast = 0;
    reelTimer = requestAnimationFrame(spinStep);
  }
}
audio.addEventListener('play', syncReels);
audio.addEventListener('error', function () {
  if (nowPlayingId) setStatus('这首歌播放失败，可能格式无法转码', true);
});
$('progWrap').onclick = function (e) {
  if (!audio.duration || !isFinite(audio.duration)) return;
  var rect = $('progWrap').getBoundingClientRect();
  var x = (e.clientX !== undefined ? e.clientX : (e.touches && e.touches[0] ? e.touches[0].clientX : rect.left)) - rect.left;
  var frac = x / rect.width;
  if (frac < 0) frac = 0; if (frac > 1) frac = 1;
  audio.currentTime = frac * audio.duration;
};
$('playBtn').onclick = togglePlay;
$('nextBtn').onclick = function () { next(false); };
$('prevBtn').onclick = prev;
/* Walkman transport keys on the machine itself + PLAY lamp / pressed key */
function setDeckState(playing) {
  setPlayIcon(playing);
  var led = $('playLed');
  if (led) led.setAttribute('fill', playing ? 'url(#wmLedOn)' : 'url(#wmLedOff)');
  var face = $('keyPlayFace');
  if (face) {
    if (playing) face.setAttribute('transform', 'translate(0 2.5)');
    else face.removeAttribute('transform');
  }
}
audio.addEventListener('play', function () { setDeckState(true); });
audio.addEventListener('pause', function () { setDeckState(false); });
$('keyPrev').addEventListener('click', prev);
$('keyPlay').addEventListener('click', togglePlay);
$('keyNext').addEventListener('click', function () { next(false); });
$('keyStop').addEventListener('click', function () {
  audio.pause();
  if (audio.duration && isFinite(audio.duration)) audio.currentTime = 0;
  $('progFill').style.width = '0%';
  $('tCur').innerHTML = '0:00';
  setPack(0);
});
/* Fullscreen player: the full view is the default; the bar is its shrunk
   form. The full view carries the queue so songs can be switched there. */
var fullMode = false;
function renderQueue() {
  var ul = $('queueList');
  ul.innerHTML = '';
  $('queueEmpty').style.display = queue.length ? 'none' : 'block';
  var i;
  for (i = 0; i < queue.length; i++) {
    (function (idx) {
      var s = queue[idx];
      var li = document.createElement('li');
      if (idx === qIndex) li.className = 'playing';
      li.appendChild(document.createTextNode(s.title || ''));
      var sub = document.createElement('span');
      sub.className = 'sub';
      sub.appendChild(document.createTextNode((s.artist || '') + (s.album ? ' · ' + s.album : '')));
      li.appendChild(sub);
      li.onclick = function () { playAt(idx); };
      ul.appendChild(li);
    })(i);
  }
}
function setFull(on) {
  fullMode = on;
  $('player').className = on ? 'full' : '';
  if (on) renderQueue();
}
$('expandBtn').onclick = function () { setFull(true); };
$('collapseBtn').onclick = function () { setFull(false); };
$('npInfo').onclick = function () { if (!fullMode) setFull(true); };
$('repeatBtn').onclick = function () {
  repeatOne = !repeatOne;
  $('repeatBtn').className = repeatOne ? 'on' : '';
};
/* Replace the whole queue with a fresh batch of random songs. A song
   that is playing keeps playing (and is re-located in the new batch);
   with nothing playing, the first new song gets previewed. */
$('refreshQueueBtn').onclick = function () {
  var btn = $('refreshQueueBtn');
  btn.disabled = true;
  api('getRandomSongs', { size: 50 }, function (root) {
    btn.disabled = false;
    var songs = asArray(root.randomSongs && root.randomSongs.song);
    if (!songs.length) return;
    var curId = nowPlayingId, i;
    queue = songs.slice(0);
    qIndex = -1;
    if (curId) {
      for (i = 0; i < queue.length; i++) {
        if (queue[i].id === curId) { qIndex = i; break; }
      }
    }
    renderQueue();
    if (!curId) previewSong(queue[0]);
  }, function () { btn.disabled = false; });
};

/* ================= Tabs / nav / login ================= */
var currentTab = 'playlists';
function setTab(name) {
  currentTab = name;
  var tabs = { playlists: 'tabPlaylists', albums: 'tabAlbums', artists: 'tabArtists', random: 'tabRandom', search: 'tabSearch' };
  var k;
  for (k in tabs) $(tabs[k]).className = (k === name) ? 'on' : '';
  $('searchBar').style.display = (name === 'search') ? 'block' : 'none';
  if (name === 'playlists') goRoot(vPlaylists);
  else if (name === 'albums') goRoot(vAlbums);
  else if (name === 'artists') goRoot(vArtists);
  else if (name === 'random') goRoot(vRandom);
  else if (name === 'search') { navStack = []; showCrumb(''); clearList(); }
}
$('tabPlaylists').onclick = function () { setTab('playlists'); };
$('tabAlbums').onclick = function () { setTab('albums'); };
$('tabArtists').onclick = function () { setTab('artists'); };
$('tabRandom').onclick = function () { setTab('random'); };
$('tabSearch').onclick = function () { setTab('search'); };
$('searchBtn').onclick = doSearch;
$('searchInput').onkeydown = function (e) { if (e.keyCode === 13) doSearch(); };
$('backBtn').onclick = function () {
  navStack.pop();
  showCrumb(navStack.length ? navStack[navStack.length - 1].title : '');
  if (navStack.length) navStack[navStack.length - 1].builder();
  else setTab(currentTab);
};
$('logoutBtn').onclick = function () {
  postJSON('/api/disconnect', {}, function () {}, function () {});
  audio.pause();
  audio.removeAttribute('src');
  nowPlayingId = null;
  $('appView').style.display = 'none';
  $('loginView').style.display = 'block';
};
/* First open lands on the fullscreen player; prefill its queue with
   random songs so there is something to play without collapsing to the
   lists first. Nothing autoplays (iOS needs a tap anyway) — the first
   song is previewed on the label and Play starts the queue. */
function previewSong(s) {
  $('npTitle').innerHTML = '';
  $('npTitle').appendChild(document.createTextNode(s.title || ''));
  $('npArtist').innerHTML = '';
  $('npArtist').appendChild(document.createTextNode(s.artist || ''));
  $('npAlbum').innerHTML = '';
  $('npAlbum').appendChild(document.createTextNode(s.album || ''));
  $('tapeTitle').textContent = clipText(s.title || '', 30);
  $('tapeArtist').textContent = clipText(s.artist || '', 34);
}
function loadRandomQueue() {
  if (queue.length) return;
  api('getRandomSongs', { size: 50 }, function (root) {
    var songs = asArray(root.randomSongs && root.randomSongs.song);
    if (!songs.length || queue.length) return;
    queue = songs.slice(0);
    renderQueue();
    previewSong(queue[0]);
  }, function () {});
}
function enterApp() {
  $('loginView').style.display = 'none';
  $('appView').style.display = 'block';
  setTab('playlists');
  setFull(true);
  loadRandomQueue();
}
$('loginBtn').onclick = function () {
  var server = $('server').value, u = $('user').value, p = $('pass').value;
  var msg = $('loginMsg');
  msg.innerHTML = '';
  if (!server || !u || !p) { msg.appendChild(document.createTextNode('服务器地址、用户名、密码都要填')); return; }
  msg.appendChild(document.createTextNode('连接中…'));
  postJSON('/api/connect', { server: server, username: u, password: p }, function () {
    msg.innerHTML = '';
    enterApp();
  }, function (errMsg) {
    msg.innerHTML = '';
    msg.appendChild(document.createTextNode(errMsg || '连接失败'));
  });
};
function postJSON(path, obj, ok, fail) {
  var xhr = new XMLHttpRequest();
  xhr.open('POST', path, true);
  xhr.setRequestHeader('Content-Type', 'application/json');
  xhr.onreadystatechange = function () {
    if (xhr.readyState !== 4) return;
    var data = null;
    try { data = JSON.parse(xhr.responseText); } catch (e) {}
    if (xhr.status === 200) { ok(data || {}); }
    else if (fail) { fail(data && data.error ? data.error : ('请求失败（HTTP ' + xhr.status + '）')); }
  };
  xhr.send(JSON.stringify(obj));
}
/* if the backend already holds a connection, skip the setup form */
(function () {
  var xhr = new XMLHttpRequest();
  xhr.open('GET', '/api/status', true);
  xhr.onreadystatechange = function () {
    if (xhr.readyState !== 4) return;
    try {
      var data = JSON.parse(xhr.responseText);
      if (data.connected) enterApp();
    } catch (e) {}
  };
  xhr.send(null);
})();
</script>
</body>
