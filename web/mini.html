<title>Submini 音乐</title>
<style>
  /* Dark palette with mint accent (#7dd3c0) from subgram's web UI.
     iOS 9.3 Safari target: floats / inline-block for layout, gradients,
     transitions, keyframes and -webkit-backdrop-filter are all fine there.
     No live blur filters on big layers: the A5 GPU can't keep up, so the
     "blurred cover" backdrop is built from colours sampled off the cover. */
  * { -webkit-tap-highlight-color: rgba(255,255,255,0.06); }
  html, body { margin: 0; padding: 0; }
  html { background: #0b0d12; }
  body { font-family: -apple-system, "PingFang SC", "Helvetica Neue", "Segoe UI", Roboto, sans-serif;
         background: transparent; color: #eef0f4; font-size: 16px; padding-bottom: 84px;
         -webkit-text-size-adjust: 100%; -webkit-font-smoothing: antialiased; }
  button { font-family: inherit; cursor: pointer; -webkit-appearance: none; }
  input { font-family: inherit; -webkit-appearance: none; }
  input:focus, button:focus { outline: none; }
  /* fixed aurora behind the whole app: three soft radial blobs, no blur */
  #aurora { position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 0; pointer-events: none;
            background:
              radial-gradient(ellipse at 0% 0%, rgba(45,212,191,0.20) 0%, rgba(45,212,191,0) 55%),
              radial-gradient(ellipse at 100% 35%, rgba(139,92,246,0.20) 0%, rgba(139,92,246,0) 55%),
              radial-gradient(ellipse at 25% 100%, rgba(236,72,153,0.10) 0%, rgba(236,72,153,0) 50%),
              #0b0d12; }
  #loginView, #appView { position: relative; z-index: 1; }
  .miniBtn { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.12);
             color: #eef0f4; font-size: 14px; border-radius: 16px; padding: 6px 14px; }
  .miniBtn:active { background: rgba(255,255,255,0.18); }
  .miniBtn[disabled] { opacity: 0.5; }
  /* ---------- login ---------- */
  #loginView { max-width: 400px; margin: 70px auto 0 auto; padding: 32px 28px 26px 28px;
               background: rgba(23,26,33,0.72); border: 1px solid rgba(255,255,255,0.08);
               border-radius: 22px; -webkit-backdrop-filter: blur(20px);
               box-shadow: 0 30px 60px rgba(0,0,0,0.45); }
  #loginView .logo { display: block; width: 76px; height: 76px; margin: 0 auto 14px auto;
                     border-radius: 18px; box-shadow: 0 10px 26px rgba(0,0,0,0.5); }
  #loginView h1 { font-size: 26px; text-align: center; margin: 0 0 6px 0; letter-spacing: 0.5px; }
  #loginView .sub { text-align: center; color: rgba(238,240,244,0.55); font-size: 14px; line-height: 1.5;
                    margin-bottom: 18px; }
  #loginView label { display: block; font-size: 13px; color: rgba(238,240,244,0.55); margin: 14px 0 6px 2px; }
  #loginView input { width: 100%; box-sizing: border-box; font-size: 17px; padding: 12px 14px;
                     border: 1px solid rgba(255,255,255,0.12); border-radius: 12px;
                     background: rgba(255,255,255,0.05); color: #eef0f4;
                     -webkit-transition: border-color 0.2s, background-color 0.2s; transition: border-color 0.2s, background-color 0.2s; }
  #loginView input:focus { border-color: #7dd3c0; background: rgba(125,211,192,0.06); }
  #loginBtn { width: 100%; margin-top: 24px; font-size: 17px; padding: 14px 0;
              background: #7dd3c0; color: #0b0d12; font-weight: bold; border: none; border-radius: 12px;
              box-shadow: 0 10px 24px rgba(125,211,192,0.28); }
  #loginBtn:active { background: #a7e8d8; }
  #loginMsg { color: #ff6b6b; font-size: 14px; text-align: center; min-height: 20px; margin-top: 12px; }
  .verTag { font-size: 11px; color: rgba(238,240,244,0.35); }
  #netNotice { position: fixed; top: 64px; left: 12px; right: 12px; z-index: 30;
               background: rgba(120,30,30,0.92); color: #ffe9e9; text-align: center;
               border: 1px solid rgba(255,255,255,0.25); border-radius: 12px;
               padding: 10px 12px; font-size: 14px; }
  /* home-screen mode: black-translucent status bar — the system
     glyphs (clock, battery) float over the app's own top 20px instead
     of a separate black strip, so everything shifts down 22px (the
     20px the glyphs need, plus a touch of air) (.sa is set from JS
     only when running standalone; Safari is unaffected). The
     landscape queue panel is absolutely positioned against the
     player's top edge, so the player's padding does not move it —
     it gets its own small nudge. */
  body.sa #tabs { padding-top: 22px; }
  body.sa #main { padding-top: 78px; }
  body.sa #player.full { padding-top: 38px; }
  body.sa #netNotice { top: 86px; }
  body.sa #player.full #queueBox { top: 20px; }
  #netNotice button { margin-left: 10px; background: rgba(255,255,255,0.16); color: #fff;
                      border: 1px solid rgba(255,255,255,0.35); border-radius: 8px;
                      padding: 4px 12px; font-size: 14px; font-family: inherit; }
  /* screensaver: two stacked cover-fit layers crossfading (background
     images, not <img> — background-size: cover works on iOS 9,
     object-fit does not reliably) */
  #saver { position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 40; background: #000; }
  .svLay { position: absolute; top: 0; left: 0; right: 0; bottom: 0;
           background-position: center; background-size: cover; opacity: 0;
           -webkit-transition: opacity 1.6s ease; transition: opacity 1.6s ease; }
  .svLay.on { opacity: 1; }
  #svCap { position: absolute; left: 18px; bottom: 14px; z-index: 2;
           color: rgba(255,255,255,0.85); font-size: 14px;
           text-shadow: 0 1px 6px rgba(0,0,0,0.85); }
  #verTagLogin { text-align: center; margin-top: 10px; }
  #verTagApp { float: right; line-height: 38px; margin-right: 10px; }
  /* ---------- app frame ---------- */
  #tabs { position: fixed; top: 0; left: 0; right: 0; z-index: 10; height: 56px; overflow: hidden;
          padding: 0 10px; background: rgba(14,16,22,0.82); -webkit-backdrop-filter: saturate(160%) blur(20px); backdrop-filter: saturate(160%) blur(20px);
          border-bottom: 1px solid rgba(255,255,255,0.07); }
  #tabs button { float: left; background: none; border: none; color: rgba(238,240,244,0.55);
                 font-size: 16px; padding: 0 15px; height: 36px; margin: 10px 2px 0 0; border-radius: 18px;
                 -webkit-transition: background-color 0.2s, color 0.2s; transition: background-color 0.2s, color 0.2s; }
  #tabs button.on { color: #fff; font-weight: bold; background: rgba(255,255,255,0.10); }
  #tabs #logoutBtn { float: right; margin-right: 0; font-size: 14px; color: rgba(238,240,244,0.4); }
  #main { padding-top: 56px; }
  #searchBar { padding: 14px 16px 6px 16px; overflow: hidden; display: none; }
  #searchInput { float: left; width: 78%; box-sizing: border-box; font-size: 16px; height: 42px;
                 padding: 0 14px; border: 1px solid rgba(255,255,255,0.12); border-radius: 21px;
                 background: rgba(255,255,255,0.06); color: #eef0f4; }
  #searchInput:focus { border-color: #7dd3c0; }
  #searchBtn { float: right; width: 19%; font-size: 16px; height: 42px;
               background: #7dd3c0; color: #0b0d12; font-weight: bold; border: none; border-radius: 21px; }
  #crumb { overflow: hidden; padding: 12px 16px 4px 16px; display: none; }
  #backBtn { float: left; background: rgba(255,255,255,0.08); border: none; color: #eef0f4; font-size: 15px;
             height: 34px; padding: 0 14px 0 10px; border-radius: 17px; margin-right: 12px; }
  #backBtn svg { width: 16px; height: 16px; vertical-align: -3px; fill: none; stroke: #eef0f4;
                 stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  #crumbTitle { font-size: 17px; font-weight: bold; line-height: 34px; white-space: nowrap;
                overflow: hidden; text-overflow: ellipsis; color: rgba(238,240,244,0.85); }
  #status { margin: 12px 16px 0 16px; padding: 10px 14px; color: rgba(238,240,244,0.6); font-size: 14px;
            display: none; border-radius: 12px; background: rgba(255,255,255,0.05); }
  #status.err { color: #ff8a8a; background: rgba(255,107,107,0.10); }
  /* ---------- lists ---------- */
  ul#list { list-style: none; margin: 8px 0 0 0; padding: 0 8px; }
  ul#list li { padding: 10px 10px; overflow: hidden; min-height: 44px; box-sizing: border-box;
               border-radius: 12px; position: relative; }
  ul#list li:active { background: rgba(255,255,255,0.06); }
  ul#list li .t { font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 22px; }
  ul#list li .s { font-size: 13px; color: rgba(238,240,244,0.5); margin-top: 2px; white-space: nowrap;
                  overflow: hidden; text-overflow: ellipsis; }
  ul#list li.nav img, ul#list li.song img.th { float: left; width: 50px; height: 50px; margin-right: 14px;
                  border-radius: 8px; background: rgba(255,255,255,0.06); }
  ul#list li.nav .txt { padding-top: 4px; }
  ul#list li.nav.round img { border-radius: 50%; }
  ul#list li.nav .go { float: right; width: 18px; height: 50px; margin-left: 8px; }
  ul#list li.nav .go svg { width: 16px; height: 16px; margin-top: 17px; fill: none; stroke: rgba(255,255,255,0.3);
                           stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  ul#list li.nav .ph { float: left; width: 50px; height: 50px; margin-right: 14px; border-radius: 8px;
                       background: rgba(125,211,192,0.12); text-align: center; line-height: 50px;
                       color: #7dd3c0; font-size: 20px; font-weight: bold; }
  ul#list li.song { padding: 8px 10px; }
  ul#list li.song img.th { width: 44px; height: 44px; border-radius: 6px; margin-right: 12px; }
  ul#list li.song .num { float: left; width: 30px; margin-right: 8px; text-align: center; line-height: 44px;
                         font-size: 14px; color: rgba(238,240,244,0.4); }
  ul#list li.song .dur { float: right; line-height: 44px; font-size: 13px; color: rgba(238,240,244,0.4);
                         margin-left: 10px; }
  ul#list li.song .txt { overflow: hidden; padding-top: 2px; }
  ul#list li.song + li.song:before { content: ''; position: absolute; top: 0; left: 60px; right: 10px;
                                     height: 1px; background: rgba(255,255,255,0.05); }
  ul#list li.playing { background: rgba(125,211,192,0.10); }
  ul#list li.playing .t { color: #7dd3c0; font-weight: bold; }
  ul#list li.playing:before, ul#list li.playing + li.song:before { display: none; }
  ul#list li.section { color: rgba(238,240,244,0.5); font-size: 13px; min-height: 0; font-weight: bold;
                       padding: 18px 10px 6px 10px; letter-spacing: 1px; border-radius: 0; clear: both; }
  ul#list li.section:active { background: none; }
  /* album / playlist header with big cover and play buttons */
  ul#list li.hero { padding: 16px 10px 18px 10px; min-height: 0; }
  ul#list li.hero:active { background: none; }
  ul#list li.hero .hcv { float: left; width: 168px; height: 168px; margin-right: 22px; border-radius: 14px;
                         background: rgba(255,255,255,0.06); box-shadow: 0 18px 40px rgba(0,0,0,0.5); }
  ul#list li.hero .htxt { overflow: hidden; padding-top: 22px; }
  ul#list li.hero .hk { font-size: 12px; letter-spacing: 2px; color: rgba(238,240,244,0.45); font-weight: bold; }
  ul#list li.hero .ht { font-size: 26px; font-weight: bold; margin-top: 6px; line-height: 1.25;
                        overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  ul#list li.hero .hs { font-size: 15px; color: rgba(238,240,244,0.65); margin-top: 6px;
                        overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  ul#list li.hero .hm { font-size: 13px; color: rgba(238,240,244,0.4); margin-top: 4px; }
  ul#list li.hero .hb { margin-top: 18px; }
  ul#list li.hero .hb button { height: 40px; padding: 0 20px 0 16px; margin-right: 10px; font-size: 15px;
                               border-radius: 20px; border: none; background: rgba(255,255,255,0.1); color: #eef0f4; }
  ul#list li.hero .hb button.pri { background: #7dd3c0; color: #0b0d12; font-weight: bold;
                                   box-shadow: 0 8px 20px rgba(125,211,192,0.25); }
  ul#list li.hero .hb svg { width: 16px; height: 16px; vertical-align: -3px; margin-right: 6px; }
  ul#list li.hero .hb .pri svg { fill: #0b0d12; }
  ul#list li.hero .hb .sec svg { fill: none; stroke: #eef0f4; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  /* album cards (grid) */
  ul#list li.card { display: inline-block; vertical-align: top; float: none; width: 25%; padding: 8px 8px 14px 8px;
                    min-height: 0; }
  @media (min-width: 900px) { ul#list li.card { width: 16.66%; } }
  @media (max-width: 600px) { ul#list li.card { width: 50%; } }
  ul#list li.card .cv { position: relative; padding-bottom: 100%; border-radius: 10px; overflow: hidden;
                        background: rgba(255,255,255,0.06); box-shadow: 0 8px 20px rgba(0,0,0,0.35); }
  ul#list li.card .cv img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
  ul#list li.card .t { font-size: 14px; margin-top: 8px; line-height: 19px; }
  ul#list li.card .s { font-size: 12px; }
  ul#list li.empty { color: rgba(238,240,244,0.45); text-align: center; padding: 40px 0; font-size: 14px; }
  /* animated equaliser shown on the playing row */
  .eq { display: inline-block; width: 16px; height: 14px; position: relative; vertical-align: middle; }
  .eq i { position: absolute; bottom: 0; width: 3px; height: 14px; background: #7dd3c0; border-radius: 1px;
          -webkit-transform-origin: 50% 100%; transform-origin: 50% 100%;
          -webkit-transform: scaleY(0.35); transform: scaleY(0.35); }
  .eq i.b1 { left: 0; } .eq i.b2 { left: 6px; } .eq i.b3 { left: 12px; }
  body.isPlaying .eq i { -webkit-animation: eqb 0.9s ease-in-out infinite alternate; animation: eqb 0.9s ease-in-out infinite alternate; }
  body.isPlaying .eq i.b2 { -webkit-animation-delay: -0.45s; animation-delay: -0.45s; -webkit-animation-duration: 0.7s; animation-duration: 0.7s; }
  body.isPlaying .eq i.b3 { -webkit-animation-delay: -0.2s; animation-delay: -0.2s; -webkit-animation-duration: 1.1s; animation-duration: 1.1s; }
  @-webkit-keyframes eqb { from { -webkit-transform: scaleY(0.2); } to { -webkit-transform: scaleY(1); } }
  @keyframes eqb { from { transform: scaleY(0.2); } to { transform: scaleY(1); } }
  ul#list li.song .eqWrap { display: none; }
  ul#list li.song.playing .eqWrap { display: block; position: absolute; left: 17px; top: 23px; line-height: 0; }
  ul#list li.song.playing.hasTh .eqWrap { left: 20px; top: 19px; padding: 4px; background: rgba(0,0,0,0.55); border-radius: 6px; }
  ul#list li.song.playing .num span { visibility: hidden; }
  /* ---------- fullscreen backdrop (cover colours, crossfaded) ---------- */
  #fullBg { position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 19; overflow: hidden;
            background: #0b0d12; display: none; }
  body.full #fullBg { display: block; }
  #fullBg .lay { position: absolute; top: -20%; left: -20%; width: 140%; height: 140%; opacity: 0;
                 -webkit-transition: opacity 1.4s ease; transition: opacity 1.4s ease; }
  #fullBg .lay.on { opacity: 1; }
  #fullBg .drift { position: absolute; top: 0; left: 0; width: 100%; height: 100%;
                   -webkit-animation: drift 36s ease-in-out infinite alternate; animation: drift 36s ease-in-out infinite alternate;
                   -webkit-animation-play-state: paused; animation-play-state: paused; }
  body.drifting #fullBg .drift { -webkit-animation-play-state: running; animation-play-state: running; }
  @-webkit-keyframes drift { from { -webkit-transform: translate3d(0,0,0) scale(1); } to { -webkit-transform: translate3d(6%,-5%,0) scale(1.12); } }
  @keyframes drift { from { transform: translate3d(0,0,0) scale(1); } to { transform: translate3d(6%,-5%,0) scale(1.12); } }
  #fullBg .shade { position: absolute; top: 0; left: 0; right: 0; bottom: 0;
                   background: radial-gradient(ellipse at 50% 35%, rgba(0,0,0,0) 0%, rgba(0,0,0,0.38) 75%),
                               linear-gradient(to bottom, rgba(0,0,0,0.05) 0%, rgba(0,0,0,0.25) 50%, rgba(0,0,0,0.6) 100%); }
  /* ---------- player bar ---------- */
  #player { position: fixed; left: 0; right: 0; bottom: 0; color: #eef0f4; z-index: 10;
            padding: 10px 14px 12px 14px; border-top: 1px solid rgba(255,255,255,0.08);
            background: rgba(16,18,24,0.95); -webkit-backdrop-filter: saturate(160%) blur(20px); backdrop-filter: saturate(160%) blur(20px);
            box-shadow: 0 -12px 30px rgba(0,0,0,0.35); }
  #barTint { position: absolute; top: 0; left: 0; right: 0; bottom: 0; opacity: 0.55; pointer-events: none;
             -webkit-transition: background 1s; transition: background 1s; }
  #player.full #barTint { display: none; }
  #player > * { position: relative; }
  #player > #barTint { position: absolute; }
  /* walkman on the left, song info on the right (user layout) */
  #npRow { overflow: hidden; }
  #walkman { float: left; width: 228px; border-radius: 16px; }
  #walkman svg { display: block; width: 100%; height: auto; }
  .wkey { cursor: pointer; }
  #npInfo { margin-left: 250px; padding-top: 34px; }
  #npKicker { display: none; }
  #npTitle { font-size: 19px; font-weight: bold; white-space: nowrap; overflow: hidden;
             text-overflow: ellipsis; letter-spacing: 0.2px; }
  #npArtist { font-size: 15px; color: rgba(238,240,244,0.75); white-space: nowrap; overflow: hidden;

  #npAlbum { font-size: 13px; color: rgba(238,240,244,0.45); white-space: nowrap; overflow: hidden;
             text-overflow: ellipsis; margin-top: 3px; }
  /* clearfix instead of overflow:hidden, which clipped the play button's glow */
  #ctlRow { margin-top: 4px; }
  #ctlRow:after { content: ''; display: block; clear: both; }
  #ctlRow .btns { float: left; }
  #ctlRow .btns button { width: 46px; height: 46px; border: none; border-radius: 50%;
                         background: rgba(255,255,255,0.08); color: #eef0f4; font-size: 19px;
                         padding: 0; margin-right: 10px; vertical-align: middle; position: relative;
                         line-height: 46px;
                         -webkit-transition: background-color 0.2s, -webkit-transform 0.12s; transition: background-color 0.2s, transform 0.12s; }
  #ctlRow .btns button:active { background: rgba(255,255,255,0.18); -webkit-transform: scale(0.92); transform: scale(0.92); }
  #ctlRow #playBtn { width: 58px; height: 58px; background: #7dd3c0; line-height: 58px;
                     box-shadow: 0 8px 22px rgba(125,211,192,0.32); }
  /* vector icons in the transport buttons: iOS renders text glyphs as

  #ctlRow .btns button .icF { width: 22px; height: 22px; fill: #eef0f4; }
  #ctlRow .btns button .icS { width: 20px; height: 20px; fill: none; stroke: #eef0f4; stroke-width: 2;

  #ctlRow #playBtn .icF { width: 26px; height: 26px; fill: #0b0d12; }
  #ctlRow #shuffleBtn.on, #ctlRow #repeatBtn.on { background: rgba(125,211,192,0.26); }
  #ctlRow #shuffleBtn.on .icS, #ctlRow #repeatBtn.on .icS { stroke: #7dd3c0; }
  #ctlRow #shuffleBtn.on:after, #ctlRow #repeatBtn.on:after { content: ''; position: absolute; left: 50%; bottom: -8px;
                                 width: 5px; height: 5px; margin-left: -3px; border-radius: 50%; background: #7dd3c0; }
  /* repeat-one lives only in the fullscreen player */
  #repeatBtn { display: none; }
  #player.full #repeatBtn { display: inline-block; }
  #repeatBtn .repOne { font-size: 8.5px; font-weight: bold; fill: #eef0f4; stroke: none; }
  #ctlRow #repeatBtn.on .repOne { fill: #7dd3c0; }
  #timeBox { float: right; color: rgba(238,240,244,0.55); font-size: 13px; line-height: 58px; }
  /* slim visible track, fat invisible tap target for seeking/dragging */
  #progWrap { padding: 8px 0; margin-top: 2px; position: relative; }
  #progTrack { background: rgba(255,255,255,0.14); height: 4px; border-radius: 2px; }
  #progFill { background: #7dd3c0; height: 4px; border-radius: 2px; width: 0%; position: relative; }
  #progFill:after { content: ''; position: absolute; right: -6px; top: -4px; width: 12px; height: 12px;

<script>
/* ================= Subsonic API layer ================= */
var CLIENT = 'submini', APIV = '1.16.1';

}
function restUrl(endpoint, params, json) {
  var q = [];

  for (k in params) {
    if (params.hasOwnProperty(k)) q.push(encodeURIComponent(k) + '=' + encodeURIComponent(params[k]));
  }

function api(endpoint, params, ok, fail, quiet) {

    if (xhr.readyState !== 4) return;
    if (xhr.status !== 200) { setStatus('请求失败（HTTP ' + xhr.status + '）', true); if (fail) fail(); return; }
    var data;
    try { data = JSON.parse(xhr.responseText); } catch (e) { setStatus('服务器响应无法解析', true); if (fail) fail(); return; }
    var root = data['subsonic-response'];
    if (!root || root.status !== 'ok') {
      var msg = (root && root.error && root.error.message) ? root.error.message : '未知错误';
      setStatus('服务器错误：' + msg, true);
      if (fail) fail(root);
      return;
    }
    if (!quiet) setStatus('', false);
    ok(root);
  };
  xhr.send(null);
}
function streamUrl(id) { return restUrl('stream', { id: id, format: 'mp3' }, false); }
function coverUrl(id, size) { return restUrl('getCoverArt', { id: id, size: size || 96 }, false); }
/* Cassette artwork for anything without a cover. The backend also swaps
   Navidrome's own (WebP, undecodable on iOS 9) placeholder for it. */
var PLACEHOLDER = '/icons/cover-placeholder.jpg';
function setCover(img, id, size) {
  queueCover(img, id ? coverUrl(id, size) : PLACEHOLDER);
}
/* Every cover in the page loads through this queue: at most 4 in
   flight at a time. One view alone (artists, ~1900 covers) otherwise
   fires thousands of requests at once, and iOS 9's handful of
   per-host connections stay wedged for every view opened after it —
   covers elsewhere then never load at all. The pump is deferred a
   tick so rows are attached first: covers of rows a view change has
   already removed are dropped instead of hogging the queue. A stuck
   image is given up on after 10s so the queue can never wedge. */
var coverQ = [], coverBusy = 0, coverPumpArmed = false;
function queueCover(img, url) {
  coverQ.push({ img: img, url: url });
  if (!coverPumpArmed) {
    coverPumpArmed = true;
    setTimeout(function () { coverPumpArmed = false; pumpCoverQ(); }, 0);
  }
}
function pumpCoverQ() {
  while (coverBusy < 4 && coverQ.length) {
    var it = coverQ.shift();
    if (!document.body.contains(it.img)) continue;
    coverBusy++;
    startCover(it);
  }
}
function startCover(it) {
  var img = it.img, done = false;

    img.onerror = null;
    img.onload = null;
    img.src = PLACEHOLDER;
    fin();

/* Long song lists (50 random songs, big playlists): row covers near
   the viewport enter the load queue first — the rest follow while

var lazyCovers = [], lazyTimer = null;
function lazyCover(img, id, size) {
  lazyCovers.push({ img: img, id: id, size: size });
}
function pumpLazyCovers() {
  var vh = window.innerHeight || 768, keep = [], i, it, r;

    if (r.bottom > -500 && r.top < vh + 500) queueCover(it.img, it.id ? coverUrl(it.id, it.size) : PLACEHOLDER);

function lazyKick() {
  if (lazyTimer) return;
  lazyTimer = setTimeout(function () { lazyTimer = null; pumpLazyCovers(); }, 120);
}
window.addEventListener('scroll', lazyKick, false);
window.addEventListener('resize', lazyKick, false);

/* ================= UI helpers ================= */
var SVGNS = 'http://www.w3.org/2000/svg';
function fmtTime(sec) {

}
function fmtLong(sec) {

function el(tag, cls, text) {

}
function setText(id, text) {

}
function hasClass(e, c) { return (' ' + e.className + ' ').indexOf(' ' + c + ' ') >= 0; }
function addClass(e, c) { if (!hasClass(e, c)) e.className = (e.className ? e.className + ' ' : '') + c; }
function removeClass(e, c) {
  e.className = (' ' + e.className + ' ').replace(' ' + c + ' ', ' ').replace(/^\s+|\s+$/g, '');
}
function toggleClass(e, c, on) { if (on) addClass(e, c); else removeClass(e, c); }
function eqIcon() {

var navStack = [];
function clearList() { var l = $('list'); while (l.firstChild) l.removeChild(l.firstChild); }
function showCrumb(title) {

}
function goRoot(builder) {

  window.scrollTo(0, 0);

}
function addRow(build) {

  build(li);
  $('list').appendChild(li);

}
function sectionRow(text) {

    li.className = 'section';
    li.appendChild(document.createTextNode(text));

}
function emptyRow(text) {

    li.className = 'empty';
    li.appendChild(document.createTextNode(text));
  });
}
/* round: artist avatars; letter placeholder when there is no cover */
function navRow(title, sub, coverId, onTap, round, artPh) {
  addRow(function (li) {

}
function cardRow(title, sub, coverId, onTap) {
  addRow(function (li) {

    img.alt = '';

    li.appendChild(cv);
    li.appendChild(el('div', 't', title || ''));

}
/* opts.num: show the album track number instead of a cover thumb */
function songRow(song, songs, opts) {
  opts = opts || {};
  var li = addRow(function (e) {
    var base = 'song';
    e.appendChild(el('span', 'dur', fmtTime(song.duration)));
    if (opts.num) {
      var n = el('span', 'num');
      n.appendChild(el('span', '', song.track || (opts.idx + 1)));
      e.appendChild(n);
    } else {
      var img = document.createElement('img');
      img.className = 'th';
      img.alt = '';
      lazyCover(img, song.coverArt, 100);
      e.appendChild(img);
      base += ' hasTh';

    var w = el('span', 'eqWrap');
    w.appendChild(eqIcon());
    e.appendChild(w);
    var txt = el('div', 'txt');

    e.className = base;

      var idx = 0, i;

}
/* album / playlist header: big cover, title, meta, play + shuffle buttons */

function songMeta(n, dur) {

}

/* ================= Views ================= */
function vPlaylists() {
  api('getPlaylists', {}, function (root) {
    clearList();

function vPlaylistSongs(id) {

function openAlbum(al) {

}
function albumRow(al) {

}
function albumCard(al) {

}
function vAlbums() {
  api('getAlbumList2', { type: 'newest', size: 60 }, function (root) {
    clearList();

    var i;
    if (albums.length === 0) emptyRow('没有专辑');

  }, function () { clearList(); });
}
function vAlbum(id) {
  api('getAlbum', { id: id }, function (root) {
    clearList();

    var songs = asArray(al.song);
    heroRow('专辑', al.name || '', (al.artist || '') + (al.year ? ' · ' + al.year : ''),

  }, function () { clearList(); });
}
function artistRow(ar) {
  navRow(ar.name, (ar.albumCount || 0) + ' 张专辑', ar.coverArt, function () {

  }, true);
}
function vArtists() {
  api('getArtists', {}, function (root) {

    /* Flatten to a (section, artist) plan and render 100 artists at a

        var left = 0, k;

    $('saver').style.display = 'block';
    saverShow(saverIdx);
    saverTimer = setInterval(function () { saverShow(saverIdx + 1); }, SAVER_STEP_MS);
  };
  xhr.send(null);
}
function saverShow(i) {
  if (!saverList.length) return;
  saverIdx = ((i % saverList.length) + saverList.length) % saverList.length;
  var item = saverList[saverIdx];
  var backEl = saverFront === 0 ? $('svB') : $('svA');
  var frontEl = saverFront === 0 ? $('svA') : $('svB');
  var img = new Image();
  img.onload = function () {
    if (!saverOn) return;
    saverErrs = 0;
    backEl.style.backgroundImage = 'url(' + item.src + ')';
    backEl.className = 'svLay on';
    frontEl.className = 'svLay';
    saverFront = saverFront === 0 ? 1 : 0;
    setText('svCap', item.caption || '');
    var nx = saverList[(saverIdx + 1) % saverList.length];
    if (nx) { var pre = new Image(); pre.src = nx.src; }
  };
  img.onerror = function () {
    /* skip a broken picture; if every picture fails, give up quietly */
    if (!saverOn) return;
    saverErrs++;
    if (saverErrs >= saverList.length) { stopSaver(); return; }
    saverShow(saverIdx + 1);
  };
  img.src = item.src;
}
function stopSaver() {
  saverOn = false;
  if (saverTimer) { clearInterval(saverTimer); saverTimer = null; }
  $('saver').style.display = 'none';
  lastTouchAt = new Date().getTime();
}
/* Seek: tap anywhere on the bar, or drag (touch) with live preview; the
   actual seek happens on release so the stream is hit only once. */
function fracAt(clientX) {
  var rect = $('progWrap').getBoundingClientRect();
  var f = (clientX - rect.left) / rect.width;
  return f < 0 ? 0 : (f > 1 ? 1 : f);
}
function canSeek() { return audio.duration && isFinite(audio.duration); }
var dragFrac = 0;
function dragTo(clientX) {
  dragFrac = fracAt(clientX);
  setProgress(dragFrac);
  var t = fmtTime(dragFrac * audio.duration);
  setText('tCur', t);
  setText('ftCur', t);
}
$('progWrap').addEventListener('touchstart', function (e) {
  if (!canSeek() || !e.touches[0]) return;
  dragging = true;
  addClass($('progWrap'), 'drag');
  dragTo(e.touches[0].clientX);
  e.preventDefault();
}, false);
$('progWrap').addEventListener('touchmove', function (e) {
  if (!dragging || !e.touches[0]) return;
  dragTo(e.touches[0].clientX);
  e.preventDefault();
}, false);
function endDrag() {
  if (!dragging) return;
  dragging = false;
  removeClass($('progWrap'), 'drag');
  if (canSeek()) audio.currentTime = dragFrac * audio.duration;
}
$('progWrap').addEventListener('touchend', endDrag, false);
$('progWrap').addEventListener('touchcancel', endDrag, false);
$('progWrap').onclick = function (e) {
  if (!canSeek()) return;
  audio.currentTime = fracAt(e.clientX) * audio.duration;
  setProgress(audio.currentTime / audio.duration);
};
$('playBtn').onclick = togglePlay;
$('nextBtn').onclick = function () { next(false); };
$('prevBtn').onclick = prev;
/* Walkman transport keys on the machine itself + PLAY lamp / pressed key */
/* The fullscreen backdrop's slow drift is the most GPU-hungry thing
   on the A5, so it no longer runs for the whole session: it breathes
   for ~12s after a track change or a resume, then rests. */
var driftTimer = null;
function pokeDrift() {
  toggleClass(document.body, 'drifting', true);
  if (driftTimer) clearTimeout(driftTimer);
  driftTimer = setTimeout(function () { toggleClass(document.body, 'drifting', false); }, 12000);
}
function setDeckState(playing) {
  setPlayIcon(playing);
  toggleClass(document.body, 'isPlaying', playing);
  var led = $('playLed');
  if (led) led.setAttribute('fill', playing ? 'url(#wmLedOn)' : 'url(#wmLedOff)');
  var face = $('keyPlayFace');
  if (face) {
    if (playing) face.setAttribute('transform', 'translate(0 2.5)');
    else face.removeAttribute('transform');
  }
}
audio.addEventListener('play', function () { setDeckState(true); pokeDrift(); });
audio.addEventListener('pause', function () { setDeckState(false); });
audio.addEventListener('ended', function () { if (audio.paused) setDeckState(false); });
$('keyPrev').addEventListener('click', prev);
$('keyPlay').addEventListener('click', togglePlay);
$('keyNext').addEventListener('click', function () { next(false); });
$('keyStop').addEventListener('click', function () {
  audio.pause();
  if (audio.duration && isFinite(audio.duration)) audio.currentTime = 0;
  setProgress(0);
  setText('tCur', '0:00');
  setText('ftCur', '0:00');
  setPack(0);
});
/* Fullscreen player: the full view is the default; the bar is its shrunk
   form. The full view carries the queue so songs can be switched there. */
var fullMode = false;
function renderQueue() {
  var ul = $('queueList');
  ul.innerHTML = '';
  $('queueEmpty').style.display = queue.length ? 'none' : 'block';
  setText('queueCount', queue.length ? queue.length + ' 首' : '');
  if (!fullMode) return;
  var i;
  for (i = 0; i < queue.length; i++) {
    (function (idx) {
      var s = queue[idx];
      var li = document.createElement('li');
      if (idx === qIndex) li.className = 'playing';
      li.appendChild(el('span', 'qd', fmtTime(s.duration)));
      var qi = el('span', 'qi');
      if (idx === qIndex) qi.appendChild(eqIcon());
      else qi.appendChild(document.createTextNode(String(idx + 1)));
      li.appendChild(qi);
      var img = document.createElement('img');
      img.alt = '';
      setCover(img, s.coverArt, 100);
      li.appendChild(img);
      li.appendChild(el('div', 'qt', s.title || ''));
      li.appendChild(el('span', 'sub', (s.artist || '') + (s.album ? ' · ' + s.album : '')));
      li.onclick = function () { playAt(idx); };
      ul.appendChild(li);
    })(i);
  }
}
function scrollQueueToCurrent() {
  var box = $('queueScroll'), li = $('queueList').childNodes[qIndex];
  if (!li || box.scrollHeight <= box.clientHeight) return;
  var top = li.offsetTop - box.clientHeight / 2 + li.offsetHeight / 2;
  box.scrollTop = top < 0 ? 0 : top;
}
function setFull(on) {
  fullMode = on;
  $('player').className = on ? 'full' : '';
  toggleClass(document.body, 'full', on);
  if (on) { renderQueue(); $('player').scrollTop = 0; scrollQueueToCurrent(); }
}
$('expandBtn').onclick = function () { setFull(true); };
$('collapseBtn').onclick = function () { setFull(false); };
$('npInfo').onclick = function () { if (!fullMode) setFull(true); };
$('barCover').onclick = function () { setFull(true); };
$('repeatBtn').onclick = function () {
  repeatOne = !repeatOne;
  $('repeatBtn').className = repeatOne ? 'on' : '';
};
/* Replace the whole queue with a fresh batch of random songs. A song
   that is playing keeps playing (and is re-located in the new batch);
   with nothing playing, the first new song gets previewed. */
$('refreshQueueBtn').onclick = function () {
  var btn = $('refreshQueueBtn');
  btn.disabled = true;
  api('getRandomSongs', { size: 50 }, function (root) {
    btn.disabled = false;
    var songs = asArray(root.randomSongs && root.randomSongs.song);
    if (!songs.length) return;
    var curId = nowPlayingId, i;
    queue = songs.slice(0);
    qIndex = -1;
    if (curId) {
      for (i = 0; i < queue.length; i++) {
        if (queue[i].id === curId) { qIndex = i; break; }
      }
    }
    renderQueue();
    if (!curId) showSong(queue[0]);
  }, function () { btn.disabled = false; }, true);
};

/* ================= Tabs / nav / login ================= */
var currentTab = 'playlists';
function setTab(name) {
  currentTab = name;
  var tabs = { playlists: 'tabPlaylists', albums: 'tabAlbums', artists: 'tabArtists', random: 'tabRandom', search: 'tabSearch' };
  var k;
  for (k in tabs) $(tabs[k]).className = (k === name) ? 'on' : '';
  $('searchBar').style.display = (name === 'search') ? 'block' : 'none';
  if (name === 'playlists') goRoot(vPlaylists);
  else if (name === 'albums') goRoot(vAlbums);
  else if (name === 'artists') goRoot(vArtists);
  else if (name === 'random') goRoot(vRandom);
  else if (name === 'search') { navStack = []; showCrumb(''); clearList(); }
}
$('tabPlaylists').onclick = function () { setTab('playlists'); };
$('tabAlbums').onclick = function () { setTab('albums'); };
$('tabArtists').onclick = function () { setTab('artists'); };
$('tabRandom').onclick = function () { setTab('random'); };
$('tabSearch').onclick = function () { setTab('search'); };
$('searchBtn').onclick = doSearch;
$('searchInput').onkeydown = function (e) { if (e.keyCode === 13) doSearch(); };
$('backBtn').onclick = function () {
  navStack.pop();
  showCrumb(navStack.length ? navStack[navStack.length - 1].title : '');
  if (navStack.length) navStack[navStack.length - 1].builder();
  else setTab(currentTab);
};
$('logoutBtn').onclick = function () {
  postJSON('/api/disconnect', {}, function () {}, function () {});
  clearState();
  wdSuspend = true;
  audio.pause();
  audio.removeAttribute('src');
  nowPlayingId = null;
  setFull(false);
  $('appView').style.display = 'none';
  $('player').style.display = 'none';
  $('loginView').style.display = 'block';
};
/* First open lands on the fullscreen player; prefill its queue with
   random songs so there is something to play without collapsing to the
   lists first. Nothing autoplays (iOS needs a tap anyway) — the first
   song is previewed on the label and Play starts the queue. */
function loadRandomQueue() {
  if (queue.length) return;
  api('getRandomSongs', { size: 50 }, function (root) {
    var songs = asArray(root.randomSongs && root.randomSongs.song);
    if (!songs.length || queue.length) return;
    queue = songs.slice(0);
    renderQueue();
    showSong(queue[0]);
  }, function () {}, true);
}
function enterApp() {
  $('loginView').style.display = 'none';
  $('appView').style.display = 'block';
  $('player').style.display = 'block';
  applyTheme(DEFAULT_THEME);
  setTab('playlists');
  setFull(true);
  /* a killed home-screen app comes back here: restore the exact
     queue/track/position — server play queue first, then this
     browser's local state — else prefill with random songs */
  restoreFromServerQueue(function (ok) {
    if (!ok && !restoreState()) loadRandomQueue();
  });
}
$('loginBtn').onclick = function () {
  var server = $('server').value, u = $('user').value, p = $('pass').value;
  var msg = $('loginMsg');
  msg.innerHTML = '';
  if (!server || !u || !p) { msg.appendChild(document.createTextNode('服务器地址、用户名、密码都要填')); return; }
  msg.appendChild(document.createTextNode('连接中…'));
  postJSON('/api/connect', { server: server, username: u, password: p }, function () {
    msg.innerHTML = '';
    enterApp();
  }, function (errMsg) {
    msg.innerHTML = '';
    msg.appendChild(document.createTextNode(errMsg || '连接失败'));
  });
};
function postJSON(path, obj, ok, fail) {
  var xhr = new XMLHttpRequest();
  xhr.open('POST', path, true);
  xhr.setRequestHeader('Content-Type', 'application/json');
  xhr.onreadystatechange = function () {
    if (xhr.readyState !== 4) return;
    var data = null;
    try { data = JSON.parse(xhr.responseText); } catch (e) {}
    if (xhr.status === 200) { ok(data || {}); }
    else if (fail) { fail(data && data.error ? data.error : ('请求失败（HTTP ' + xhr.status + '）')); }
  };
  xhr.send(JSON.stringify(obj));
}
/* show the running build's version (stamped from the release tag) */
(function () {
  var vx = new XMLHttpRequest();
  vx.open('GET', '/api/version', true);
  vx.onreadystatechange = function () {
    if (vx.readyState !== 4 || vx.status !== 200) return;
    try {
      var v = JSON.parse(vx.responseText).version;
      if (v) {
        setText('verTagLogin', 'submini ' + v);
        setText('verTagApp', 'submini ' + v);
      }
    } catch (e) {}
  };
  vx.send(null);
})();
/* if the backend already holds a connection, skip the setup form */
(function () {
  var xhr = new XMLHttpRequest();
  xhr.open('GET', '/api/status', true);
  xhr.onreadystatechange = function () {
    if (xhr.readyState !== 4) return;
    try {
      var data = JSON.parse(xhr.responseText);
      if (data.connected) enterApp();
    } catch (e) {}
  };
  xhr.send(null);
})();
</script>
