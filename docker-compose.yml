services:
  submini:
    image: passport888/submini:latest
    container_name: submini
    restart: unless-stopped
    ports:
      - "9898:9898"
    environment:
      # Your Subsonic server (Navidrome) address. Override without editing
      # this file: put SUBSONIC_URL=... in a local .env file (gitignored).
      SUBSONIC_URL: "${SUBSONIC_URL:-http://192.168.1.10:4533}"
