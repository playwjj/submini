services:
  submini:
    image: passport888/submini:latest
    container_name: submini
    restart: unless-stopped
    ports:
      - "9898:9898"
    volumes:
      # Connection settings (server + account token) live in a SQLite DB
      # in /data; keep it on a named volume so they survive upgrades.
      - submini-data:/data

volumes:
  submini-data:
