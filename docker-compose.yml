services:
  submini:
    image: passport888/submini:latest
    container_name: submini
    restart: unless-stopped
    # Host networking on purpose: the default Docker bridge is IPv4-only,
    # so an IPv6-only upstream (a public AAAA-only hostname) is unreachable
    # from inside the container. With host networking the container uses
    # the host's stack, IPv6 included. Port 9898 is then on the host
    # directly, so no ports: mapping is needed (or possible).
    network_mode: host
    volumes:
      # Connection settings (server + account token) live in a SQLite DB
      # in /data. Bind-mounted to ./data next to this file so the data is
      # easy to see and back up. Create it first, owned by the user the
      # container runs as (65534), or SQLite cannot open its DB:
      #   mkdir -p data && sudo chown 65534:65534 data
      - ./data:/data
